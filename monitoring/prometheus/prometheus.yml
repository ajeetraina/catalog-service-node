global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Model Runner metrics
  - job_name: 'model-runner'
    static_configs:
      - targets: ['model-runner:9090']
    scrape_interval: 5s
    metrics_path: /metrics

  # Chatbot backend metrics (if implemented)
  - job_name: 'chatbot-backend'
    static_configs:
      - targets: ['chatbot-backend:3001']
    scrape_interval: 10s
    metrics_path: /metrics

  # Demo client metrics (if implemented)
  - job_name: 'demo-client'
    static_configs:
      - targets: ['demo-client:5173']
    scrape_interval: 30s
    metrics_path: /metrics
